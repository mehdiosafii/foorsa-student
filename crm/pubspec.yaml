name: foorsa_crm
description: "Foorsa CRM: home.foorsa.ma for the Foorsa team, on iPhone, iPad and Android."
publish_to: "none"

# The release: raising this line on main builds the app and sends it to
# TestFlight and Google Play's internal testing (crm/README.md).
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  # Named so the app can hand the plugin its own iOS web view widget
  # (lib/src/web_view_touch.dart); both come with flutter_inappwebview.
  flutter_inappwebview_ios: ^1.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  # Google and passkey sign-in happen in the phone's own browser, which hands
  # the session back to the app (lib/src/browser_sign_in.dart).
  flutter_web_auth_2: ^6.1.0
  crypto: ^3.0.6
  package_info_plus: ^8.3.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0

# The web view's Android plugin with the student app's Foorsa patches
# (../third_party/README.md): one copy for both apps.
dependency_overrides:
  flutter_inappwebview_android:
    path: ../third_party/flutter_inappwebview_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/
