name: Guided scanner validation

on:
  pull_request:
    paths:
      - 'lib/src/guided_scanner/**'
      - 'lib/src/shell_page.dart'
      - 'lib/src/config.dart'
      - 'test/guided_scanner_test.dart'
      - 'test/scan_text_reading_test.dart'
      - 'test/live_text_reader_test.dart'
      - 'test/native_document_scanner_test.dart'
      - 'android/app/src/main/kotlin/ma/foorsa/student/LiveTextReader.kt'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/guided-scanner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The Android build's Java, as android.yml and google-play.yml pin it: the runner's own
      # default moved to a Java whose class files (major version 69) this Gradle cannot read,
      # and the debug APK failed to build (26 Nov 2026).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve Flutter camera dependencies
        run: flutter pub get
      - name: Validate Flutter analyzer
        run: flutter analyze --no-fatal-infos
      - name: Test detection and stable auto shutter
        run: flutter test
      - name: Verify Android plugin build
        run: flutter build apk --debug
      - name: Inspect resolved dependency lockfile
        if: always()
        run: |
          echo '=====BEGIN_FOORSA_PUBSPEC_LOCK====='
          cat pubspec.lock
          echo '=====END_FOORSA_PUBSPEC_LOCK====='
