name: App Store listing

# Reads (and, from a later change, keeps) the App Store listing of Foorsa Student through the
# App Store Connect API, with the team key the TestFlight workflow uses. It prints states, counts
# and whether a field is filled, never the key, a contact's details or a demo password.
on:
  workflow_dispatch:
    inputs:
      action:
        description: state | review-check | demo-hash
        required: true
        default: state
  push:
    branches: [claude/sweet-allen-fl4203]
    paths:
      - 'store/app-store/**'
      - 'scripts/app_store_listing.py'
      - '.github/workflows/app-store-listing.yml'

permissions:
  contents: read

concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: App Store listing
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          ACTION: ${{ inputs.action || 'state' }}
          # A one-off key whose private half never leaves the session restoring the demo account.
          DEMO_HASH_PUBKEY: |
            -----BEGIN PUBLIC KEY-----
            MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwyZg6xfQdPuxVEulYRcT
            2GedvMpESGRHroDLU6Ih+V5jRRxl5Ja7LdDm8xCyMKPvVtVXazldOcbxUZ3hiVTi
            h7iTjeb2585gUR57m5xTfHsnnCuWs0PAYrGpVO2mPV48EEL7CqIlTkoIzPkUKhMW
            TuGi/mr1+HGU6Toepxu1n/sV6KO+blRxqcmdck2oLZI42Mb4YfZkmK2GZmV31gMx
            VlMHodxcr1fOAx3BrLgPT01FBB1cprnkIVds96A0E5+rrQPnYZc08xUR6jEc58Gw
            xErlIVOFNXu/HPOlLXAkZOK3owmE4FaLhJJrbJ72bnK3SJhhdQhbybcSOcYOTr/z
            BMZgzv3oJ/tQ9mqj1XkndgpZXZJdCYmjPFwM4RdpM513hxmC1drJKkeoowm4qoTu
            8sTXGzgAXx//u9VbkNPuTxBLfzXn+H05yTcZGvVnbL3bUOvn5DB4J9W5NhZ8Ysx5
            qVfG/tfUW1ZYqjzQYjCmDDDURmCO+c6LZl6J/1E4rOtLAgMBAAE=
            -----END PUBLIC KEY-----
        run: |
          python3 scripts/app_store_listing.py "$ACTION"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 -m pip install --quiet bcrypt==4.2.1
            python3 scripts/app_store_listing.py demo-hash
          fi
