name: App Store listing

# Reads (and, from a later change, keeps) the App Store listing of Foorsa Student through the
# App Store Connect API, with the team key the TestFlight workflow uses. It prints states, counts
# and whether a field is filled, never the key, a contact's details or a demo password.
on:
  workflow_dispatch:
    inputs:
      action:
        description: state | review-check | demo-hash | submit-latest
        required: true
        default: state
  push:
    branches: [claude/sweet-allen-fl4203]
    paths:
      - 'store/app-store/**'
      - 'scripts/app_store_listing.py'
      - '.github/workflows/app-store-listing.yml'

permissions:
  contents: read

concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: App Store listing
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          ACTION: ${{ inputs.action == 'submit-latest' && 'state' || inputs.action || 'state' }}
        run: |
          python3 scripts/app_store_listing.py "$ACTION"
          if [ "$GITHUB_EVENT_NAME" = push ]; then python3 scripts/app_store_listing.py review-check; fi
      - name: Put the newest build up for review
        # Only a push whose message asks for it, or a run started with this action.
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[app-store submit]'))
          || inputs.action == 'submit-latest'
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          python3 scripts/app_store_listing.py submit-latest
          python3 scripts/app_store_listing.py state
