# Builds the iOS app and uploads it to TestFlight.
#
# - A push to main that changes the `version:` line of pubspec.yaml builds that
#   version and uploads it. Bumping 1.2.17+34 to 1.2.17+35 is the release.
# - Actions > TestFlight > Run workflow builds the chosen branch on demand; only
#   a run on main uploads.
# - A pull request that touches this file, pubspec.yaml, pubspec.lock or ios/
#   runs the same build without uploading, signed when the signing secrets are
#   set and unsigned otherwise.
#
# Signing: with the distribution certificate and its profile in the secrets,
# the build signs with them; with only the App Store Connect key (an Admin
# key), Apple signs it in the cloud. Secrets and variables it reads are
# described in README.md ("iOS release build").
name: TestFlight

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight (runs on main only)
        type: boolean
        default: true
  pull_request:
    paths: [.github/workflows/testflight.yml, pubspec.yaml, pubspec.lock, 'ios/**', 'android/app/google-services.json', scripts/verify_firebase_config.py]

# Releases wait their turn rather than replace each other: with the default
# queue a newer run would cancel a pending version bump.
concurrency:
  group: testflight-${{ github.ref }}
  queue: max

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  BUNDLE_ID: ma.foorsa.foorsaStudent
  TEAM_ID: G865J7CMBG
  PROFILE_NAME: Foorsa Student App Store

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.read.outputs.name }}
      number: ${{ steps.read.outputs.number }}
      build: ${{ steps.read.outputs.build }}
      upload: ${{ steps.read.outputs.upload }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          version_of() {
            grep -E '^version:' | head -n1 \
              | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+#.*$//; s/[[:space:]]+$//' | tr -d "\"'"
          }
          version=$(version_of < pubspec.yaml)
          name=${version%%+*}
          number=${version#*+}
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$number" =~ ^[0-9]+$ && "$version" == *+* ]]; then
            echo "::error file=pubspec.yaml::version must look like 1.2.17+34, found '$version'"
            exit 1
          fi
          build=true
          upload=false
          case "$EVENT" in
            push)
              upload=true
              # Only a changed version line is a release; other pubspec edits are not.
              if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
                && git fetch --quiet --depth=1 origin "$BEFORE"; then
                previous=$(git show "$BEFORE:pubspec.yaml" | version_of || true)
                if [[ "$previous" == "$version" ]]; then
                  build=false
                  echo "pubspec.yaml changed but its version is still $version: nothing to release."
                fi
              fi
              ;;
            workflow_dispatch)
              if [[ "$UPLOAD_INPUT" == "true" && "$GITHUB_REF" == refs/heads/main ]]; then
                upload=true
              elif [[ "$UPLOAD_INPUT" == "true" ]]; then
                echo "::warning::Only main uploads to TestFlight; building $GITHUB_REF without uploading."
              fi
              ;;
          esac
          {
            echo "name=$name"
            echo "number=$number"
            echo "build=$build"
            echo "upload=$upload"
          } >> "$GITHUB_OUTPUT"
          echo "### Version $name ($number): build=$build, upload=$upload" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify Firebase app registrations
        run: python3 scripts/verify_firebase_config.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ios:
    needs: [version, checks]
    if: needs.version.outputs.build == 'true'
    runs-on: macos-26
    # The build takes about 25 minutes; waiting for Apple's processing can add 40.
    timeout-minutes: 90
    env:
      BUILD_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
      UPLOAD: ${{ needs.version.outputs.upload }}
      HAS_CERT: ${{ secrets.IOS_DISTRIBUTION_P12 != '' && secrets.IOS_DISTRIBUTION_P12_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
      HAS_ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' && vars.APPSTORE_API_KEY_ID != '' && vars.APPSTORE_ISSUER_ID != '' }}
    steps:
      # Two ways to sign. With the Apple Distribution certificate and its
      # profile in the secrets, the build signs with them ("manual"). With only
      # the App Store Connect key, an Admin key, Apple signs it in the cloud
      # ("cloud"): no certificate has to be exported from anybody's Mac.
      # Uploading always needs the key.
      - name: Choose how to sign
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
          HAS_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID != '' }}
          HAS_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID != '' }}
        run: |
          if [[ "$HAS_CERT" == true ]]; then
            signing=manual
          elif [[ "$HAS_ASC_KEY" == true ]]; then
            signing=cloud
          else
            signing=none
          fi
          if [[ "$UPLOAD" == true ]]; then
            missing=()
            [[ "$HAS_KEY" == true ]] || missing+=("secret APPSTORE_API_PRIVATE_KEY")
            [[ "$HAS_KEY_ID" == true ]] || missing+=("variable APPSTORE_API_KEY_ID")
            [[ "$HAS_ISSUER_ID" == true ]] || missing+=("variable APPSTORE_ISSUER_ID")
            if (( ${#missing[@]} )); then
              printf -v list '%s, ' "${missing[@]}"
              echo "::error::Missing ${list%, } (README.md, iOS release build, says where each comes from)."
              exit 1
            fi
          fi
          echo "SIGNING=$signing" >> "$GITHUB_ENV"
          echo "Signing: $signing" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # App Store Connect refuses a build number it already has, but only after
      # the whole build; ask first so the run stops in a minute.
      - name: Stop if App Store Connect already has this build number
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: python3 scripts/app_store_connect.py check-build-number "$BUNDLE_ID" "$BUILD_NUMBER"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install the distribution certificate and the provisioning profile
        if: env.SIGNING == 'manual'
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # The Release configuration signs with this profile by name, so check
          # the secrets hold the right pair before spending a build on them.
          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          expires=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          echo "Profile '$name' for $app_id, expires $expires"
          if [[ "$name" != "$PROFILE_NAME" ]]; then
            echo "::error::IOS_PROVISIONING_PROFILE is '$name'; the Release build signs with '$PROFILE_NAME'."
            exit 1
          fi
          if [[ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]]; then
            echo "::error::IOS_PROVISIONING_PROFILE is for $app_id, not $TEAM_ID.$BUNDLE_ID."
            exit 1
          fi
          # The profile must not have expired, and it must have been made for
          # the certificate in IOS_DISTRIBUTION_P12.
          if ! python3 - "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_certs.txt" <<'PY'
          import datetime, hashlib, plistlib, sys
          profile = plistlib.load(open(sys.argv[1], "rb"))
          if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              sys.exit(1)
          for cert in profile["DeveloperCertificates"]:
              print(hashlib.sha1(cert).hexdigest().upper())
          PY
          then
            echo "::error::IOS_PROVISIONING_PROFILE expired on $expires. Download it again from developer.apple.com and replace the secret."
            exit 1
          fi
          identities=$(security find-identity -p codesigning "$keychain" | awk '/"Apple Distribution/ {print $2}')
          if [[ -z "$identities" ]] || ! grep -qxF -f "$RUNNER_TEMP/profile_certs.txt" <<< "$identities"; then
            echo "::error::IOS_DISTRIBUTION_P12 holds no Apple Distribution certificate that '$name' was made for. Export the certificate the profile uses, or edit the profile to include this certificate and replace IOS_PROVISIONING_PROFILE."
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/dist.mobileprovision" "$dir/$uuid.mobileprovision"
          done

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build the signed IPA
        if: env.SIGNING == 'manual'
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          # flutter build ipa reports success even when the export step fails.
          ipa=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n1 || true)
          if [[ -z "$ipa" ]]; then
            echo "::error::The archive built but no IPA was exported; see the export errors above."
            exit 1
          fi
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "Built $ipa ($(du -h "$ipa" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Apple signs the export with the team's cloud-managed distribution
      # certificate, whose private key never leaves Apple. Only an Admin key may
      # do that: an App Manager key signs in but is refused ("Cloud signing
      # permission error").
      - name: Build the IPA and sign it in the cloud
        if: env.SIGNING == 'cloud'
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          (umask 077; printf '%s\n' "$ASC_KEY" > "$key")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # The team's certificates before the build, so the clean-up step
          # revokes only what Xcode makes on this runner.
          python3 scripts/app_store_connect.py certificates DEVELOPMENT IOS_DEVELOPMENT > "$RUNNER_TEMP/dev-certs-before.txt"
          python3 scripts/app_store_connect.py certificates DISTRIBUTION IOS_DISTRIBUTION > "$RUNNER_TEMP/dist-certs-before.txt"

          cat > "$RUNNER_TEMP/ExportOptions-cloud.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

          export_ipa() {
            rm -rf build/ios/ipa
            xcodebuild -exportArchive -archivePath "$1" -exportPath build/ios/ipa \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-cloud.plist" "${auth[@]}"
          }

          exported_push() {
            shopt -s nullglob
            local found=(build/ios/ipa/*.ipa)
            [[ ${#found[@]} -gt 0 ]] && bash scripts/push_entitlement.sh "${found[0]}" || true
          }

          # The archive is built unsigned and signed once, by Apple, at export.
          flutter build ipa --release --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          # An archive that was never signed carries no entitlements of its own,
          # and an export may sign it without the push entitlement: such an
          # app is refused by APNs and can never register for notifications
          # (docs/student-push.md). It is archived again, signed, as below.
          if ! export_ipa build/ios/archive/Runner.xcarchive || [[ "$(exported_push)" != production ]]; then
            # An export can refuse an archive that was never signed. Archive
            # again with automatic signing: Xcode makes a development
            # certificate through the key, which the clean-up step revokes.
            # The development profile's aps-environment is development, which
            # the App Store export turns into production.
            echo "::warning::The unsigned archive did not export, or exported without the push entitlement ($(exported_push || true)); archiving again with automatic signing."
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
              -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive "${auth[@]}" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic 'CODE_SIGN_STYLE[sdk=iphoneos*]=Automatic' \
              CODE_SIGN_IDENTITY='Apple Development' 'CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Development' \
              PROVISIONING_PROFILE_SPECIFIER= 'PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]=' \
              APS_ENVIRONMENT=development
            export_ipa "$RUNNER_TEMP/Runner.xcarchive"
          fi
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          ipa=${ipas[0]:-}
          if [[ -z "$ipa" ]]; then
            echo "::error::No IPA was exported; see the export errors above."
            exit 1
          fi
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "Built $ipa ($(du -h "$ipa" | cut -f1)), signed by Apple in the cloud" >> "$GITHUB_STEP_SUMMARY"

      # Every signed build carries the production push entitlement, or it does
      # not go to TestFlight: without it APNs refuses the app and no phone can
      # register for notifications (docs/student-push.md). The summary lists
      # the exported app's entitlements, so a run says what it shipped.
      - name: Check the push entitlement
        if: env.SIGNING != 'none'
        run: |
          set -euo pipefail
          aps=$(bash scripts/push_entitlement.sh "$IPA")
          keys=$(bash scripts/push_entitlement.sh --keys "$IPA")
          echo "Entitlements of the exported app: ${keys:-none}. aps-environment: ${aps:-missing}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$aps" != production ]]; then
            echo "::error::The exported app's aps-environment is '${aps:-missing}', not production: APNs would refuse it and no iPhone could register for notifications. See docs/student-push.md."
            exit 1
          fi

      - name: Build without signing (no signing secrets yet)
        if: env.SIGNING == 'none'
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          echo "Unsigned build of $BUILD_NAME ($BUILD_NUMBER) succeeded; add the App Store Connect key (or the signing secrets) to produce an IPA." >> "$GITHUB_STEP_SUMMARY"

      # Waits until App Store Connect has processed the build, so a green run
      # means the build is in TestFlight.
      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        uses: apple-actions/upload-testflight-build@155ea93be9ee6d5186c71f660a612f5eddb14510 # v5.6.0
        with:
          app-path: ${{ env.IPA }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Uploaded
        if: env.UPLOAD == 'true'
        run: echo "Build $BUILD_NAME ($BUILD_NUMBER) is processed and in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      # A development certificate Xcode made on this runner dies with it, so
      # it is revoked rather than left to pile up to Apple's limit. A
      # distribution certificate is never revoked: Apple marks a build that is
      # uploaded but not yet submitted for review "Invalid Binary" when its
      # certificate is revoked.
      - name: Revoke the development certificate Xcode made for this run
        if: always() && env.SIGNING == 'cloud'
        env:
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          [[ -f "$RUNNER_TEMP/dev-certs-before.txt" ]] || exit 0
          python3 scripts/app_store_connect.py revoke-new "$RUNNER_TEMP/dev-certs-before.txt" DEVELOPMENT IOS_DEVELOPMENT
          python3 scripts/app_store_connect.py report-new "$RUNNER_TEMP/dist-certs-before.txt" DISTRIBUTION IOS_DISTRIBUTION

      - name: Remove the signing keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/profile_certs.txt"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
