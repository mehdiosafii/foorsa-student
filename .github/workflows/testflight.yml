# Builds the iOS app and uploads it to TestFlight.
#
# - A push to main that changes the `version:` line of pubspec.yaml builds that
#   version and uploads it. Bumping 1.2.17+34 to 1.2.17+35 is the release.
# - Actions > TestFlight > Run workflow builds main's current version on demand.
# - A pull request that edits this file runs the same build without uploading,
#   signed when the signing secrets are set and unsigned otherwise.
#
# Secrets and variables it reads are described in README.md ("iOS release build").
name: TestFlight

on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: true
  pull_request:
    paths: [.github/workflows/testflight.yml]

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  BUNDLE_ID: ma.foorsa.foorsaStudent
  TEAM_ID: G865J7CMBG
  PROFILE_NAME: Foorsa Student App Store

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.read.outputs.name }}
      number: ${{ steps.read.outputs.number }}
      build: ${{ steps.read.outputs.build }}
      upload: ${{ steps.read.outputs.upload }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          version_of() { grep -E '^version:' | head -n1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//'; }
          version=$(version_of < pubspec.yaml)
          name=${version%%+*}
          number=${version#*+}
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$number" =~ ^[0-9]+$ && "$version" == *+* ]]; then
            echo "::error file=pubspec.yaml::version must look like 1.2.17+34, found '$version'"
            exit 1
          fi
          build=true
          upload=false
          case "$EVENT" in
            push)
              upload=true
              # Only a changed version line is a release; other pubspec edits are not.
              if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
                && git fetch --quiet --depth=1 origin "$BEFORE"; then
                previous=$(git show "$BEFORE:pubspec.yaml" | version_of || true)
                if [[ "$previous" == "$version" ]]; then
                  build=false
                  echo "pubspec.yaml changed but its version is still $version: nothing to release."
                fi
              fi
              ;;
            workflow_dispatch)
              [[ "$UPLOAD_INPUT" == "true" ]] && upload=true
              ;;
          esac
          {
            echo "name=$name"
            echo "number=$number"
            echo "build=$build"
            echo "upload=$upload"
          } >> "$GITHUB_OUTPUT"
          echo "### Version $name ($number): build=$build, upload=$upload" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  ios:
    needs: [version, checks]
    if: needs.version.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.number }}
      UPLOAD: ${{ needs.version.outputs.upload }}
      HAS_SIGNING: ${{ secrets.IOS_DISTRIBUTION_P12 != '' && secrets.IOS_DISTRIBUTION_P12_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE != '' }}
      HAS_API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' && vars.APPSTORE_API_KEY_ID != '' && vars.APPSTORE_ISSUER_ID != '' }}
    steps:
      - name: Release builds need the signing secrets and the App Store Connect key
        if: env.UPLOAD == 'true' && (env.HAS_SIGNING != 'true' || env.HAS_API_KEY != 'true')
        run: |
          echo "::error::Uploading needs the secrets IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_P12_PASSWORD, IOS_PROVISIONING_PROFILE and APPSTORE_API_PRIVATE_KEY, and the variables APPSTORE_API_KEY_ID and APPSTORE_ISSUER_ID (see README.md, iOS release build)."
          exit 1

      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install the distribution certificate and the provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/dist.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # The Release configuration signs with this profile by name, so check
          # the secret holds the right one before spending a build on it.
          security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          expires=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          echo "Profile '$name' for $app_id, expires $expires"
          if [[ "$name" != "$PROFILE_NAME" ]]; then
            echo "::error::IOS_PROVISIONING_PROFILE is '$name'; the Release build signs with '$PROFILE_NAME'."
            exit 1
          fi
          if [[ "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]]; then
            echo "::error::IOS_PROVISIONING_PROFILE is for $app_id, not $TEAM_ID.$BUNDLE_ID."
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/dist.mobileprovision" "$dir/$uuid.mobileprovision"
          done

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Build the signed IPA
        if: env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          ipa=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "IPA=$ipa" >> "$GITHUB_ENV"
          echo "Built $ipa ($(du -h "$ipa" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Build without signing (no signing secrets yet)
        if: env.HAS_SIGNING != 'true'
        run: |
          flutter build ios --release --no-codesign \
            --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"
          echo "Unsigned build of $BUILD_NAME ($BUILD_NUMBER) succeeded; add the signing secrets to produce an IPA." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'

      - name: Uploaded
        if: env.UPLOAD == 'true'
        run: echo "Build $BUILD_NAME ($BUILD_NUMBER) uploaded. App Store Connect processes it in 10 to 30 minutes, then it appears in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.mobileprovision" "$RUNNER_TEMP/profile.plist"
