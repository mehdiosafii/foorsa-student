name: foorsa_student
description: "Foorsa Student portal."
publish_to: "none"

version: 1.2.37+68

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^8.3.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_pdfview: ^1.4.5
  image_picker: ^1.1.2
  camera: ^0.11.4
  file_picker: ^8.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_webrtc: 1.6.3
  flutter_callkit_incoming: 3.1.6
  http: 1.6.0
  audioplayers: 6.8.1
  local_auth: 3.0.2
  flutter_secure_storage: 10.3.4

# Two Android plugins carry a small Foorsa patch (third_party/README.md).
dependency_overrides:
  # The web view: its androidx.webkit settings calls threw on some phones'
  # WebView, the web view was never created and the app sat on its loader.
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  # The camera: the guided scanner's still in CameraX's quality mode.
  camera_android_camerax:
    path: third_party/camera_android_camerax

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A fake camera for the Android scanner's screen test (guided_scan_page_test.dart).
  camera_platform_interface: ^2.15.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/biometric_session.js
    - assets/icons/
    - assets/images/
    - assets/sounds/onboarding/
    # The adhan the app calls at prayer times (student_adhan.dart), the iPhone's notification sound.
    - assets/sounds/adhan/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  image_path_ios: "assets/icons/app_icon_ios.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  image_path_ios_dark_transparent: "assets/icons/app_icon_ios.png"
  image_path_ios_tinted_grayscale: "assets/icons/app_icon_ios.png"
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#FFFFFF"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#183250"
  image: assets/images/splash_logo.png
  android_12:
    color: "#183250"
    image: assets/images/splash_logo_a12.png
  ios: true
  android: true

