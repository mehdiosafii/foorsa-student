name: foorsa_student
description: "Foorsa Student portal."
publish_to: "none"

version: 1.2.15+24

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^8.3.0
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_pdfview: 1.3.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#183250"
  image: assets/images/splash_logo.png
  android_12:
    color: "#183250"
    image: assets/images/splash_logo_a12.png
  ios: true
  android: true
